        .btn-outline:hover { background-color: #929E8B; color: white; }
        .hover-zoom { overflow: hidden; }
        .hover-zoom img { transition: transform 0.6s ease; }
        .hover-zoom:hover img { transform: scale(1.05); }
    </style>
